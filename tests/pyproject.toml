[project]
name = "eggdrop-tests"
version = "0.0.0"
description = "Integration test harness for Eggdrop"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Run in parallel by default. `--dist loadgroup` keeps tests tagged with the
# same `xdist_group` on one worker (see test_ident_scenarios.py, which shares
# the fixed identd port 1113). Override the worker count with `-n0` (serial)
# or `-n <N>` for debugging.
addopts = "-ra -q --strict-markers --timeout=60 --tb=short -n auto --dist loadgroup"
markers = [
    "slow: end-to-end tests that exercise reconnect/timeouts",
    "partyline: spawns eggdrop with -nt so stdin is the HQ partyline",
]
# pytest sweeps it on session exit.
tmp_path_retention_policy = "all"
tmp_path_retention_count = 3

[tool.ruff]
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplifications
    "RET",              # return statements
    "PIE",              # misc
    "PT",               # pytest style
    "RUF",              # ruff-specific
]
ignore = [
    "E501",             # line length — let formatter handle
    "PT011",            # pytest.raises(Exception) — fine here
]

[tool.ty.src]
include = ["support", "tests", "conftest.py"]

[tool.ty.rules]
# All on by default; bump anything we want stricter here.
