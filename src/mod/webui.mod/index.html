<!doctype html>
<html lang="en" style="height: 100%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1" />
    <title>Eggdrop</title>
  </head>
  <!--gruvbox colors-->
  <body
    style="
      display: grid;
      grid-template-rows: 1fr auto;
      margin: 0px;
      height: 100%;
      background-color: #282828;
      color: #ebdbb2;
    "
  >
    <pre id="out" style="overflow: auto"></pre>
    <input
      id="d"
      type="text"
      class="b"
      onkeydown="b(this)"
      autofocus
      style="width: 100%"
    />
    <script>
      "use strict";
      const WS_ECHO_ON = "\x01";
      const WS_ECHO_OFF = "\x02";
      const ws = new WebSocket(
        (location.protocol === "https:" ? "wss:" : "ws:") +
          location.host +
          "/w",
      );
      out = document.getElementById("out");
      let echo = true;
      let sendCount = 0;
      ws.addEventListener("close", (event) => {
        d.remove();
        out.innerHTML = out.innerHTML + "Connection closed by foreign host.";
        out.scrollTop = out.scrollHeight;
      });
      ws.addEventListener("message", (event) => {
        out.innerHTML = out.innerHTML + event.data.replace(/[\x01-\x02]/g, "");
        out.scrollTop = out.scrollHeight;
        if (event.data.includes(WS_ECHO_ON)) {
          d.type = "text";
          echo = true;
        } else if (event.data.includes(WS_ECHO_OFF)) {
          d.type = "password";
          echo = false;
        }
      });
      function b(c) {
        if (event.key === "Enter") {
          ws.send(c.value);
          if (echo) {
            out.innerHTML = out.innerHTML + c.value + "\n";
            out.scrollTop = out.scrollHeight;
          }
          c.value = "";
          if (sendCount++ == 0) {
            d.type = "password";
            echo = false;
          }
        }
      }
    </script>
  </body>
</html>
